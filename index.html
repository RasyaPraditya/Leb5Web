<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum JavaScript Lengkap</title>
</head>
<body>
    <h1>Pengenalan JavaScript</h1>
    <p id="pesan">Konten awal.</p>
    
    <!-- Bagian Cek Bilangan & Ubah Warna -->
    <div style="margin-bottom: 20px;">
        <label for="bilangan">Masukkan bilangan bulat:</label>
        <input type="number" id="bilangan" step="1">
        <button type="button" onclick="cekBilangan()">Periksa</button>
        <p id="hasilBilangan"></p>
        
        <button type="button" onclick="ubahWarnaLatar('lightgreen')">Latar Hijau</button>
        <button type="button" onclick="ubahWarnaLatar('white')">Latar Putih</button>
        <button type="button" onclick="ubahWarnaLatar('lightyellow')">Latar Kuning</button>
    </div>

    <!-- Bagian Menu Makanan -->
    <div style="margin-bottom: 20px;">
        <h3>Daftar Menu Makanan</h3>
        <label><input type="checkbox" class="menu" value="5000"> Ayam Goreng — Rp5.000</label><br>
        <label><input type="checkbox" class="menu" value="500"> Tempe — Rp500</label><br>
        <label><input type="checkbox" class="menu" value="2500"> Telur Dadar — Rp2.500</label><br>
        <p><strong>Total: Rp<span id="total">0</span></strong></p>
    </div>

    <hr>

    <!-- Bagian Kalkulator Nilai Mahasiswa -->
    <div>
        <h2>Kalkulator Nilai Mahasiswa</h2>
        <label for="inputTugas">Nilai Tugas (0–100):</label><br>
        <input type="number" id="inputTugas" min="0" max="100" placeholder="Contoh: 85"><br><br>

        <label for="inputUts">Nilai UTS (0–100):</label><br>
        <input type="number" id="inputUts" min="0" max="100" placeholder="Contoh: 78"><br><br>

        <label for="inputUas">Nilai UAS (0–100):</label><br>
        <input type="number" id="inputUas" min="0" max="100" placeholder="Contoh: 88"><br><br>

        <button type="button" onclick="prosesHitungNilai()">Hitung Nilai</button>

        <h3>Hasil Perhitungan:</h3>
        <div id="hasilKalkulator">
            <p>Nilai Akhir: -</p>
            <p>Predikat: -</p>
            <p>Status: -</p>
        </div>
    </div>

    <!-- Pemanggilan script.js diletakkan di akhir body agar elemen sudah siap dibaca -->
    <script src="script.js"></script>
</body>
</html>
